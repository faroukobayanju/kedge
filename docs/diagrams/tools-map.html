<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where neatlogs, Entire and cfo.ai plug in</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper: #f4f6f8; --ink: #111214; --muted: #4a4f57;
      --sans: 'Archivo', system-ui, sans-serif; --serif: 'Archivo', sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-family: var(--serif); font-size: clamp(1.5rem, 2.4vw + .75rem, 2rem); font-weight: 900; letter-spacing: -.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · Kedge</p>
  <h1>Where neatlogs, Entire and cfo.ai plug in</h1>
  <div class="diagram-container">
    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tools-map-title tools-map-desc">
      <title id="tools-map-title">Where neatlogs, Entire and cfo.ai plug in</title>
      <desc id="tools-map-desc">The Kedge supervisor clones a failing PR, drives an OpenCode agent one step at a time, sends a neatlogs span per step, gets an Entire checkpoint on every agent commit, writes run files that feed the dashboard and the cfo.ai business plan, and pushes a draft PR to the fork.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a4f57"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a4a0e"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f4f6f8"/>

      <!-- arrows -->
      <g fill="none" stroke="#4a4f57" stroke-width="1.2">
        <line x1="450" y1="116" x2="450" y2="198" marker-end="url(#arrow)"/>
        <line x1="510" y1="200" x2="510" y2="118" marker-end="url(#arrow)"/>
        <line x1="380" y1="220" x2="282" y2="220" marker-end="url(#arrow)"/>
        <line x1="280" y1="252" x2="378" y2="252" marker-end="url(#arrow)"/>
        <line x1="480" y1="272" x2="480" y2="342" marker-end="url(#arrow)"/>
        <line x1="380" y1="372" x2="282" y2="372" marker-end="url(#arrow)"/>
      </g>
      <g fill="none" stroke="#9a4a0e" stroke-width="1.2">
        <path d="M580 216 H624 Q632 216 632 208 V156 Q632 148 640 148 H678" marker-end="url(#arrow-link)"/>
        <line x1="580" y1="256" x2="678" y2="256" marker-end="url(#arrow-link)"/>
        <line x1="580" y1="372" x2="678" y2="372" marker-end="url(#arrow-link)"/>
      </g>

      <!-- labels -->
      <g font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing=".06em" text-anchor="middle" fill="#6b717a">
        <rect x="392" y="152" width="48" height="12" rx="2" fill="#f4f6f8"/><text x="416" y="161">CLONE PR</text>
        <rect x="520" y="152" width="48" height="12" rx="2" fill="#f4f6f8"/><text x="544" y="161">DRAFT PR</text>
        <rect x="306" y="200" width="48" height="12" rx="2" fill="#f4f6f8"/><text x="330" y="209">ONE STEP</text>
        <rect x="296" y="232" width="68" height="12" rx="2" fill="#f4f6f8"/><text x="330" y="241">DIFF + REPLY</text>
        <rect x="490" y="302" width="36" height="12" rx="2" fill="#f4f6f8"/><text x="508" y="311">WRITE</text>
        <rect x="314" y="352" width="32" height="12" rx="2" fill="#f4f6f8"/><text x="330" y="361">READ</text>
        <rect x="640" y="176" width="34" height="12" rx="2" fill="#f4f6f8"/><text x="657" y="185" fill="#9a4a0e">SPANS</text>
        <rect x="608" y="236" width="44" height="12" rx="2" fill="#f4f6f8"/><text x="630" y="245" fill="#9a4a0e">COMMITS</text>
        <rect x="596" y="352" width="68" height="12" rx="2" fill="#f4f6f8"/><text x="630" y="361" fill="#9a4a0e">TOKENS / PR</text>
      </g>

      <g font-family="'Archivo', sans-serif">
        <!-- fork -->
        <rect x="380" y="60" width="200" height="56" rx="6" fill="#ffffff" stroke="#111214"/>
        <text x="388" y="75" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing=".08em" fill="#4a4f57">GITHUB</text>
        <text x="480" y="92" font-size="12" font-weight="600" text-anchor="middle" fill="#111214">Failing PR + fork</text>
        <text x="480" y="106" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#4a4f57">gh pr checkout · git push</text>

        <!-- kedge (focal) -->
        <rect x="380" y="200" width="200" height="72" rx="6" fill="rgba(227,36,27,.07)" stroke="#e3241b" stroke-width="1.4"/>
        <text x="388" y="215" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing=".08em" fill="#b0170f">CORE</text>
        <text x="480" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#111214">Kedge supervisor</text>
        <text x="480" y="256" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#4a4f57">plan · check · roll back</text>

        <!-- agent -->
        <rect x="100" y="200" width="180" height="72" rx="6" fill="#ffffff" stroke="#111214"/>
        <text x="108" y="215" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing=".08em" fill="#4a4f57">AGENT</text>
        <text x="190" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#111214">OpenCode agent</text>
        <text x="190" y="256" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#4a4f57">free model · or Claude Code</text>

        <!-- tools -->
        <rect x="680" y="120" width="200" height="56" rx="6" fill="#ffffff" stroke="#9a4a0e"/>
        <text x="688" y="135" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing=".08em" fill="#9a4a0e">TRACE</text>
        <text x="780" y="152" font-size="12" font-weight="600" text-anchor="middle" fill="#111214">neatlogs</text>
        <text x="780" y="166" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#4a4f57">trace per run · span per step</text>

        <rect x="680" y="228" width="200" height="56" rx="6" fill="#ffffff" stroke="#9a4a0e"/>
        <text x="688" y="243" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing=".08em" fill="#9a4a0e">CHECKPOINTS</text>
        <text x="780" y="260" font-size="12" font-weight="600" text-anchor="middle" fill="#111214">Entire</text>
        <text x="780" y="274" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#4a4f57">checkpoint per agent commit</text>

        <rect x="680" y="344" width="200" height="56" rx="6" fill="#ffffff" stroke="#9a4a0e"/>
        <text x="688" y="359" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing=".08em" fill="#9a4a0e">BUSINESS</text>
        <text x="780" y="376" font-size="12" font-weight="600" text-anchor="middle" fill="#111214">cfo.ai</text>
        <text x="780" y="390" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#4a4f57">price · margin · runway</text>

        <!-- run files -->
        <rect x="380" y="344" width="200" height="56" rx="6" fill="#ffffff" stroke="#111214"/>
        <text x="388" y="359" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing=".08em" fill="#4a4f57">FILES</text>
        <text x="480" y="376" font-size="12" font-weight="600" text-anchor="middle" fill="#111214">runs/&lt;id&gt;/</text>
        <text x="480" y="390" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#4a4f57">steps · state · result</text>

        <rect x="100" y="344" width="180" height="56" rx="6" fill="#ffffff" stroke="#111214"/>
        <text x="108" y="359" font-family="'JetBrains Mono', monospace" font-size="7" letter-spacing=".08em" fill="#4a4f57">UI</text>
        <text x="190" y="376" font-size="12" font-weight="600" text-anchor="middle" fill="#111214">kedge ui + site/</text>
        <text x="190" y="390" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" fill="#4a4f57">replay every run</text>
      </g>

      <!-- legend -->
      <line x1="30" y1="428" x2="930" y2="428" stroke="rgba(17,18,20,.10)" stroke-width=".8"/>
      <g font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing=".14em" fill="#4a4f57">
        <text x="30" y="452">LEGEND</text>
        <line x1="110" y1="449" x2="142" y2="449" stroke="#4a4f57" stroke-width="1.2" marker-end="url(#arrow)"/><text x="152" y="452">DATA FLOW</text>
        <line x1="250" y1="449" x2="282" y2="449" stroke="#9a4a0e" stroke-width="1.2" marker-end="url(#arrow-link)"/><text x="292" y="452">HACKATHON TOOL</text>
        <rect x="420" y="443" width="24" height="12" rx="3" fill="rgba(227,36,27,.07)" stroke="#e3241b"/><text x="454" y="452">KEDGE</text>
      </g>
    </svg>
  </div>
</div>
</body>
</html>
