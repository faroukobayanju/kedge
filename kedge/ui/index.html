<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kedge · Contact sheet</title>
<link rel="stylesheet" href="fonts2.css">
<link rel="stylesheet" href="app.css?v=30">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-race" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h13M3 16h18"/><path d="M13 5l3 3-3 3M18 13l3 3-3 3"/></g></symbol>
  <symbol id="i-pr" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M6 8.2v7.6M18 15.8V10a3 3 0 0 0-3-3h-4M13 4.5 10.5 7l2.5 2.5"/></g></symbol>
  <symbol id="i-sheets" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h13v13H4z"/><path d="M7 4h13v13"/></g></symbol>
</svg>

<header class="lab">
  <button class="label" id="sheetsBtn" type="button" aria-expanded="false" aria-controls="sheets">
    <span class="label-name">Kedge</span>
    <span class="label-sub" id="labelSub">Contact sheet</span>
    <svg aria-hidden="true"><use href="#i-sheets"/></svg>
  </button>
  <p class="tally" id="tally" aria-live="polite"></p>
  <div class="lab-actions">
    <button class="pill" id="raceBtn" type="button" aria-pressed="false"><svg aria-hidden="true"><use href="#i-race"/></svg>Race</button>
    <button class="play" id="playBtn" type="button" aria-label="Play replay"><svg aria-hidden="true"><use href="#i-play"/></svg><span>Replay</span></button>
  </div>
</header>

<nav class="sheets" id="sheets" aria-label="Runs" hidden>
  <div class="sheets-head"><h2>Sheets</h2><span id="raceHint" class="race-hint" hidden>Pick two sheets to race</span></div>
  <ol id="sheetList"></ol>
</nav>

<main class="lightbox" id="lightbox">
  <section class="bench" id="bench" aria-label="Replay"></section>
  <div class="loupe" id="loupe" aria-hidden="true"><div class="loupe-in" id="loupeIn"></div></div>
  <section class="envelope" id="envelope" aria-label="Lab notes"></section>
</main>

<template id="emptyTpl">
  <div class="empty">
    <p class="mark-note big">No film on the box yet.</p>
    <p>Shoot a run and it develops here:</p>
    <pre><code>uv run python -m kedge run &lt;pr-url&gt;</code></pre>
  </div>
</template>

<script src="app.js?v=30" type="module"></script>
</body>
</html>
